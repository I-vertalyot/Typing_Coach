<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Coach</title>
<meta name="description" content="Ten-finger typing lessons that also teach English writing and clear requests to Claude.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&amp;display=swap">
<style>
:root {
  /* Plan: a quiet study page (paper, ink, highlighter). The keyboard is the one bold object;
     the finger zones carry all the color. Layout: left-aligned reading column, typing screen centered. */
  --paper: #F2F4F7;
  --sheet: #FFFFFF;
  --ink: #17203A;
  --ink-2: #4A5468;
  --ink-3: #6F798C;
  --rule: #D9DEE7;
  --mark: #FFE15A;
  --mark-ink: #17203A;
  --pen: #1F5FC4;
  --good: #0B7D47;
  --bad: #C42F2F;
  --bad-bg: #FCE4E4;
  --focus: #2A78D6;
  --f-pinky: #E87BA4; --f-ring: #2A78D6; --f-middle: #1BAF7A; --f-lindex: #EDA100; --f-rindex: #6250D6; --f-thumb: #A9B1BF;
  --i-pinky: #1F0E17; --i-ring: #FFFFFF; --i-middle: #062019; --i-lindex: #231800; --i-rindex: #FFFFFF; --i-thumb: #17203A;
  --key: #FFFFFF; --key-edge: #C2C9D5; --key-ink: #2A3348; --key-dim: #E9EDF2; --kb-bed: #E2E6EC;
  --chart: #2A78D6;
  --font-ui: "Recursive", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Recursive", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 0 rgba(23, 32, 58, .04), 0 10px 28px -16px rgba(23, 32, 58, .25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1219; --sheet: #161B25; --ink: #E7EBF3; --ink-2: #AEB6C6; --ink-3: #8790A3; --rule: #283041;
    --mark: #F0CD45; --mark-ink: #12161F; --pen: #7FB0FF; --good: #3CC88C; --bad: #FF7070; --bad-bg: #3B1D24; --focus: #7FB0FF;
    --f-pinky: #D55181; --f-ring: #3987E5; --f-middle: #199E70; --f-lindex: #C98500; --f-rindex: #9085E9; --f-thumb: #5E687B;
    --i-pinky: #12080D; --i-ring: #08111F; --i-middle: #04170F; --i-lindex: #170F00; --i-rindex: #0D0A1F; --i-thumb: #F0F2F6;
    --key: #222936; --key-edge: #0A0D13; --key-ink: #D9DEE8; --key-dim: #1A1F2A; --kb-bed: #11151D;
    --chart: #3987E5;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1219; --sheet: #161B25; --ink: #E7EBF3; --ink-2: #AEB6C6; --ink-3: #8790A3; --rule: #283041;
  --mark: #F0CD45; --mark-ink: #12161F; --pen: #7FB0FF; --good: #3CC88C; --bad: #FF7070; --bad-bg: #3B1D24; --focus: #7FB0FF;
  --f-pinky: #D55181; --f-ring: #3987E5; --f-middle: #199E70; --f-lindex: #C98500; --f-rindex: #9085E9; --f-thumb: #5E687B;
  --i-pinky: #12080D; --i-ring: #08111F; --i-middle: #04170F; --i-lindex: #170F00; --i-rindex: #0D0A1F; --i-thumb: #F0F2F6;
  --key: #222936; --key-edge: #0A0D13; --key-ink: #D9DEE8; --key-dim: #1A1F2A; --kb-bed: #11151D;
  --chart: #3987E5;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-variation-settings: "CASL" 0, "MONO" 0;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 39px; }
h2 { font-size: 25px; }
h3 { font-size: 18px; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.display { font-variation-settings: "CASL" 1, "MONO" 0; font-weight: 780; letter-spacing: -0.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.lede { font-size: 18px; color: var(--ink-2); max-width: 62ch; }
.warn { color: var(--bad); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

/* ── Header ── */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in oklab, var(--paper) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.top-in { max-width: 1100px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 22px; }
.brand { display: inline-flex; align-items: center; gap: 2px; text-decoration: none; font-variation-settings: "CASL" 1; font-weight: 800; font-size: 20px; flex: none; }
.brand-kc { font-size: 15px; min-width: 28px; height: 28px; display: inline-grid; place-items: center; }
.nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-link { text-decoration: none; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 560; white-space: nowrap; }
.nav-link:hover { color: var(--ink); background: color-mix(in oklab, var(--rule) 45%, transparent); }
.nav-link.on { color: var(--ink); background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 88%, transparent 88%); }
.sync-wrap { position: relative; flex: none; margin-left: auto; }
.sync { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 12px 4px 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.sync .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); margin-left: 4px; }
.sync[data-state="synced"] .dot { background: var(--good); }
.sync[data-state="saving"] .dot, .sync[data-state="connecting"] .dot { background: var(--f-lindex); }
.sync[data-state="paused"] .dot { background: var(--bad); }
.sync .avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.sync[data-state="synced"] .sync-label::before { content: "✓ "; color: var(--good); }
.sync-pop { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, 86vw); background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); font-size: 14px; display: grid; gap: 6px; }
.sync-pop p { color: var(--ink-2); }

/* ── Buttons & inputs ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 10px; padding: 9px 16px; border: 1px solid transparent; cursor: pointer;
  font-weight: 620; text-decoration: none; line-height: 1.2; white-space: nowrap;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: color-mix(in oklab, var(--ink) 86%, var(--focus)); }
.btn.ghost { background: var(--sheet); border-color: var(--rule); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink-3); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger-ghost { background: transparent; border-color: color-mix(in oklab, var(--bad) 50%, var(--rule)); color: var(--bad); }
.btn.big { padding: 12px 20px; font-size: 17px; }
.btn.small { padding: 6px 11px; font-size: 14px; border-radius: 8px; }
.btn.icon-only { padding: 6px 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .ico { display: inline-flex; }
.btn .ico svg { width: 18px; height: 18px; }
.kbd-hint { font-size: 11px; font-weight: 600; opacity: .65; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 2px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.input { width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; }
.input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.input.area { resize: vertical; min-height: 120px; line-height: 1.5; }
select.input { width: auto; padding-right: 28px; }
label { font-weight: 600; font-size: 14px; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; }
.sec-head { display: grid; gap: 4px; margin: 34px 0 14px; }
.sec-head.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.page-head { padding: 34px 0 6px; display: grid; gap: 10px; }

/* inline keycap */
.kc {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1.9em; height: 1.9em; padding: 0 .45em;
  background: var(--key); color: var(--key-ink);
  border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 6px;
  font-weight: 650; font-size: .9em; line-height: 1; vertical-align: middle;
  font-variation-settings: "CASL" 0, "MONO" 0;
}
.kc.wide { padding: 0 .65em; font-size: .8em; }
.kcs { display: inline-flex; flex-wrap: wrap; gap: 5px; }

.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
.tag.en { background: color-mix(in oklab, var(--f-middle) 22%, var(--sheet)); color: var(--ink); }
.tag.ai { background: color-mix(in oklab, var(--f-rindex) 20%, var(--sheet)); color: var(--ink); }

.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.star svg path { fill: transparent; stroke: var(--ink-3); stroke-width: 1.5; }
.star.on svg path { fill: var(--mark); stroke: color-mix(in oklab, var(--mark) 55%, var(--ink)); }

.finger { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); }
.fdot { width: 12px; height: 12px; border-radius: 50%; background: var(--zc); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--zc) 70%, var(--ink)); }
[data-zone="pinky"] { --zc: var(--f-pinky); --zi: var(--i-pinky); }
[data-zone="ring"] { --zc: var(--f-ring); --zi: var(--i-ring); }
[data-zone="middle"] { --zc: var(--f-middle); --zi: var(--i-middle); }
[data-zone="lindex"] { --zc: var(--f-lindex); --zi: var(--i-lindex); }
[data-zone="rindex"] { --zc: var(--f-rindex); --zi: var(--i-rindex); }
[data-zone="thumb"] { --zc: var(--f-thumb); --zi: var(--i-thumb); }

/* ── Learn ── */
.learn-intro { padding: 38px 0 22px; display: grid; gap: 12px; }
.learn-intro h1 { font-size: clamp(30px, 5vw, 44px); }
.learn-top { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(220px, 1fr); gap: 16px; }
.continue { display: grid; gap: 18px; align-content: space-between; border-color: color-mix(in oklab, var(--mark) 60%, var(--rule)); box-shadow: inset 6px 0 0 var(--mark); padding-left: 28px; }
.cont-main { display: grid; gap: 10px; }
.cont-title { font-size: 31px; font-variation-settings: "CASL" .6; font-weight: 760; }
.pair { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; color: var(--ink-2); }
.today { display: grid; gap: 8px; align-content: start; }
.today-num { font-size: 15px; color: var(--ink-2); }
.today-num strong { font-size: 39px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }
.meter { height: 8px; background: color-mix(in oklab, var(--rule) 70%, transparent); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--good); border-radius: 999px; }

.course { padding-bottom: 60px; }
.lessons { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.lesson-row + .lesson-row { border-top: 1px solid var(--rule); }
.lr-link { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 112px; gap: 16px; align-items: center; padding: 14px 18px; text-decoration: none; }
.lr-link:hover { background: color-mix(in oklab, var(--rule) 30%, var(--sheet)); }
.lr-num { font-variation-settings: "MONO" 1; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lr-main { display: grid; gap: 3px; min-width: 0; }
.lr-title { font-weight: 680; font-size: 17px; }
.lr-sub { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; }
.lr-sub .tag.ai { margin-left: 8px; }
.lr-keys .kc { font-size: 12px; }
.lr-status { justify-self: end; }
.lesson-row.is-next .lr-num { color: var(--ink); background: var(--mark); border-radius: 6px; text-align: center; padding: 2px 0; }
.lesson-row.is-done .lr-num { color: var(--good); }
.prog-pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in oklab, var(--mark) 45%, var(--sheet)); font-variant-numeric: tabular-nums; }
.prog-pill.empty { background: transparent; color: var(--ink-3); font-weight: 500; }

/* ── Lesson ── */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-weight: 600; margin-top: 22px; }
.back:hover { color: var(--ink); }
.lesson-head { display: grid; gap: 8px; padding: 14px 0 22px; }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.lesson-main { display: grid; gap: 16px; }
.lesson-intro { font-size: 17px; max-width: 64ch; }
.keys-panel { display: grid; gap: 14px; }
.kb-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.kb-legend .lg { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--key-edge); margin-left: 6px; }
.kb-legend .lg.new { background: linear-gradient(90deg, var(--f-pinky) 0 20%, var(--f-ring) 20% 40%, var(--f-middle) 40% 60%, var(--f-lindex) 60% 80%, var(--f-rindex) 80%); width: 28px; }
.kb-legend .lg.known { background: var(--key); }
.kb-legend .lg.dim { background: var(--key-dim); opacity: .6; }
.fingers { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.fingers li { display: inline-flex; align-items: center; gap: 8px; }
.tips { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tip { display: grid; gap: 8px; align-content: start; }
.tip-label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.tip-label::before { content: ""; width: 10px; height: 10px; border-radius: 3px; }
.tip-en .tip-label::before { background: var(--f-middle); }
.tip-ai .tip-label::before { background: var(--f-rindex); }
.tip h3 { font-size: 21px; font-variation-settings: "CASL" .6; font-weight: 740; }
.tip-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.ba { display: grid; gap: 14px; }
.ba-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ba-b, .ba-a { border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.ba-b { background: color-mix(in oklab, var(--bad) 7%, var(--sheet)); }
.ba-b p { text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--bad) 55%, transparent); color: var(--ink-2); }
.ba-a { background: color-mix(in oklab, var(--good) 9%, var(--sheet)); }
.ba-a p { font-weight: 560; }
.ba-tag { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.ba-why { grid-column: 1 / -1; color: var(--ink-2); padding-left: 2px; }
.lesson-side { position: sticky; top: 76px; display: grid; gap: 14px; }
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ex-btn { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
.ex-btn:hover { border-color: var(--ink-3); background: color-mix(in oklab, var(--rule) 25%, var(--sheet)); }
.ex-num { font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: center; }
.ex-item.done .ex-num { color: var(--good); }
.ex-text { font-family: var(--font-mono); font-variation-settings: "MONO" 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.lesson-nav { display: flex; justify-content: space-between; padding: 28px 0 60px; }
.done-line { display: flex; align-items: center; gap: 6px; color: var(--good); font-weight: 600; }

/* ── Keyboard ── */
.kb-wrap { overflow-x: auto; }
.kb {
  container-type: inline-size;
  width: 100%; max-width: 860px; margin: 0 auto;
  background: var(--kb-bed); border: 1px solid var(--rule); border-radius: 16px; padding: 10px;
  user-select: none; -webkit-user-select: none;
}
.small-kb .kb { max-width: 640px; }
.kb-row { display: flex; gap: .6cqw; }
.kb-row + .kb-row { margin-top: .6cqw; }
.key {
  flex: var(--w) 1 0; min-width: 0; height: 5.7cqw; position: relative;
  background: color-mix(in oklab, var(--zc) 17%, var(--key));
  border: 1px solid var(--key-edge); border-bottom-width: .35cqw; border-radius: .9cqw;
  color: var(--key-ink);
  font-size: max(9px, 1.9cqw); font-weight: 600; line-height: 1;
  transition: transform .06s;
}
.key.special { background: var(--key-dim); }
.key.space { background: color-mix(in oklab, var(--zc) 22%, var(--key)); }
.k-main { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: max(10px, 2.2cqw); }
.k-shift { position: absolute; left: 14%; top: 14%; font-size: max(8px, 1.5cqw); opacity: .75; }
.k-base { position: absolute; left: 14%; bottom: 16%; font-size: max(9px, 1.9cqw); }
.k-sp { position: absolute; left: 10%; bottom: 16%; font-size: max(8px, 1.3cqw); font-weight: 560; opacity: .7; }
.bump { position: absolute; left: 50%; bottom: 13%; width: 24%; height: 2px; border-radius: 2px; background: currentColor; opacity: .5; transform: translateX(-50%); }
.enter-top { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-width: 0; height: calc(5.7cqw + .6cqw + 1px); z-index: 1; }
.enter-bottom { border-top-left-radius: 0; border-top-right-radius: 0; border-top-width: 0; }
.key.next { background: var(--zc); color: var(--zi); border-color: color-mix(in oklab, var(--zc) 60%, #000); transform: translateY(-1px); box-shadow: 0 0 0 .45cqw color-mix(in oklab, var(--zc) 35%, transparent); z-index: 2; }
.key.next .bump { opacity: .8; }
.key.hit-ok { animation: hitok .18s ease-out; }
.key.hit-bad { animation: hitbad .32s ease-out; }
@keyframes hitok { 0% { transform: translateY(2px); filter: brightness(.92); } 100% { transform: none; } }
@keyframes hitbad { 0%, 60% { background: var(--bad); color: #fff; } 100% { } }
.key.is-dim { opacity: .38; }
.key.is-new { background: var(--zc); color: var(--zi); border-color: color-mix(in oklab, var(--zc) 60%, #000); box-shadow: 0 0 0 .4cqw color-mix(in oklab, var(--zc) 30%, transparent); }
.kb.heatmap .key:not(.heat) { background: var(--key-dim); color: var(--ink-3); }
.key.heat { background: color-mix(in oklab, var(--bad) var(--heat), var(--key)); }
.key.heat[style*="--heat: 0%"] { background: var(--key); }
.kb-area { display: grid; justify-items: center; gap: 8px; margin-top: 14px; }
.kb-area .kb { max-width: 780px; }
.hands { width: 100%; max-width: 330px; height: auto; }
.hands .fing { fill: color-mix(in oklab, var(--zc) 30%, var(--sheet)); stroke: color-mix(in oklab, var(--zc) 55%, var(--ink-3)); stroke-width: 1; transition: fill .1s; }
.hands .fing.on { fill: var(--zc); stroke: color-mix(in oklab, var(--zc) 60%, #000); }
.hands .palm { fill: color-mix(in oklab, var(--rule) 70%, var(--sheet)); stroke: var(--rule); }

/* ── Typing ── */
.typing { max-width: 960px; padding-bottom: 60px; }
.ty-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 16px 0 10px; }
.ty-head .back { margin-top: 0; }
.ty-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ty-title strong { font-size: 17px; }
.ex-dots { display: inline-flex; gap: 5px; }
.xd { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
.xd.ok { background: var(--good); border-color: var(--good); }
.xd.cur { outline: 2px solid var(--mark); outline-offset: 2px; border-color: var(--ink); }
.ty-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; margin-bottom: 10px; }
.ty-note p { color: var(--ink-2); }
.tt-box { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 22px 26px 16px; box-shadow: var(--shadow); }
.tt-box.shake { animation: shake .22s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.tt-text:focus-visible { outline: none; }
.tt-text {
  --tt: 28px;
  font-family: var(--font-mono); font-variation-settings: "MONO" 1, "CASL" 0; font-weight: 440;
  font-size: var(--tt); line-height: 1.7; max-height: calc(3 * 1.7em); overflow: hidden; position: relative;
  outline: none;
}
:root[data-size="s"] .tt-text { --tt: 22px; }
:root[data-size="l"] .tt-text { --tt: 34px; }
.tt-inner { white-space: pre-wrap; overflow-wrap: break-word; transition: transform .14s ease-out; position: relative; }
.ch { color: var(--ink); border-radius: 3px; }
.ch.done { color: var(--ink-3); }
.ch.cur { position: relative; }
.ch.cur::before {
  content: ""; position: absolute; left: -1px; top: .12em; bottom: .12em; width: 3px; border-radius: 2px;
  background: var(--ink); animation: caret 1.05s step-end infinite;
}
@keyframes caret { 50% { opacity: 0; } }
.ch.bad { color: var(--bad); background: var(--bad-bg); }
.ch.sp.bad { box-shadow: inset 0 -3px 0 var(--bad); }
.ch.slip { text-decoration: underline wavy var(--bad); text-decoration-thickness: 1.5px; text-underline-offset: .28em; }
.tt-stats { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 26px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); position: relative; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--ink-2); }
.stat strong { font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; font-variation-settings: "MONO" 1; font-weight: 600; }
.tt-prog { position: absolute; left: 0; right: 0; top: -1px; height: 2px; }
.tt-prog span { display: block; height: 2px; width: 0; background: var(--ink); transition: width .12s; }
.tt-box.finished .tt-text { opacity: .55; }
.typing.is-done .hint-row, .typing.is-done .tt-stats { display: none; }
.hint-row { display: flex; align-items: center; gap: 14px; min-height: 40px; margin-top: 12px; flex-wrap: wrap; }
.ty-hint { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--ink-2); }
.caps-chip { background: var(--bad); color: #fff; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
.layout-banner { background: color-mix(in oklab, var(--mark) 35%, var(--sheet)); border: 1px solid color-mix(in oklab, var(--mark) 70%, var(--rule)); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.layout-note { text-align: center; }
.sink { position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; }
.result { margin-top: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 24px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.res-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
.res-top h2 { font-variation-settings: "CASL" .7; font-weight: 760; margin-bottom: 6px; }
.res-top .stars svg { width: 26px; height: 26px; }
.res-nums { display: flex; gap: 28px; flex-wrap: wrap; }
.rn { display: grid; }
.rn strong { font-size: 35px; font-variant-numeric: tabular-nums; font-variation-settings: "MONO" 1; font-weight: 600; line-height: 1.1; }
.rn span { font-size: 13px; color: var(--ink-2); }
.res-miss { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); }
.miss { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; }
.res-lesson { background: color-mix(in oklab, var(--good) 10%, var(--sheet)); border-radius: 10px; padding: 12px 14px; }
.res-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

/* ── Practice ── */
.drills { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.hand-card .cta-row { gap: 8px; }
.drill { display: grid; gap: 10px; align-content: space-between; }
.drill-body { min-height: 30px; }
.drill .btn { justify-self: start; }
.text-list { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.text-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 16px; }
.text-row + .text-row { border-top: 1px solid var(--rule); }
.tr-main { display: grid; gap: 2px; min-width: 0; }
.tr-main strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-actions { display: flex; gap: 6px; flex: none; }
.editor { display: grid; gap: 8px; margin-bottom: 14px; }
.editor-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.empty { display: grid; gap: 14px; justify-items: start; }
.gen-form { display: grid; gap: 14px; }
.gen-form > .btn { justify-self: start; }
.gen-fields { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: grid; gap: 6px; }
.field.grow { flex: 1 1 260px; }
.gen-out { margin-top: 14px; display: grid; gap: 10px; }
.gen-result { display: grid; gap: 10px; }
.thinking { color: var(--ink-2); }
.thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.my-texts, .gen, .journal { margin-top: 8px; }
.practice, .coach, .progress, .options { padding-bottom: 60px; }

/* ── Coach ── */
.coach-form { display: grid; gap: 10px; margin-top: 10px; }
.ideas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--ink-3); }
.chip.on { background: var(--mark); border-color: color-mix(in oklab, var(--mark) 60%, var(--ink)); color: var(--mark-ink); }
.scenario { background: color-mix(in oklab, var(--mark) 25%, var(--sheet)); border-radius: 10px; padding: 10px 12px; }
.big-area { font-size: 18px; min-height: 150px; }
.coach-out { margin-top: 16px; }
.feedback { display: grid; gap: 14px; }
.praise { font-size: 18px; font-variation-settings: "CASL" 1; color: var(--good); }
.fb-block { display: grid; gap: 10px; }
.marks { font-size: 19px; line-height: 1.9; }
del { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
del + ins { margin-left: .3em; }
ins { color: var(--pen); text-decoration: none; font-variation-settings: "CASL" 1; font-weight: 650; background: color-mix(in oklab, var(--pen) 10%, transparent); border-radius: 4px; padding: 0 2px; }
.mistakes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mistakes li { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.mistakes li:last-child { border-bottom: 0; padding-bottom: 0; }
.mk-pair { font-size: 17px; }
.mk-why { color: var(--ink-2); font-size: 15px; }
.clarity { display: flex; align-items: center; gap: 5px; }
.cl { width: 34px; height: 10px; border-radius: 3px; background: color-mix(in oklab, var(--rule) 80%, transparent); }
.cl.on { background: var(--good); }
.cl-word { margin-left: 8px; font-weight: 650; }
.improved blockquote { margin: 0; padding: 12px 16px; border-left: 4px solid var(--pen); background: color-mix(in oklab, var(--pen) 7%, var(--sheet)); border-radius: 0 10px 10px 0; font-size: 18px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: center; }
.checks input { width: 18px; height: 18px; accent-color: var(--good); }
.checks label { font-weight: 500; font-size: 16px; }

/* ── Progress ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0 16px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; }
.tile strong { font-size: 31px; font-variant-numeric: tabular-nums; font-variation-settings: "MONO" 1; font-weight: 600; line-height: 1.1; }
.tile > span:not(.small) { color: var(--ink-2); font-size: 14px; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.progress .panel { display: grid; gap: 6px; }
.progress .panel + .panel { margin-top: 16px; }
.charts .panel + .panel { margin-top: 0; }
.chart { position: relative; }
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-svg .grid { stroke: var(--rule); stroke-width: 1; }
.chart-svg .axis { stroke: var(--ink-3); stroke-width: 1; }
.chart-svg .tick { fill: var(--ink-2); font-size: 12px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart-svg .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .area { fill: color-mix(in oklab, var(--chart) 12%, transparent); }
.chart-svg .dot { fill: var(--sheet); stroke: var(--chart); stroke-width: 2; }
.chart-svg .dot.last { fill: var(--chart); stroke: var(--sheet); stroke-width: 2; }
.chart-svg .cross { stroke: var(--ink-3); stroke-dasharray: 3 3; }
.chart-svg .bar { fill: var(--chart); }
.chart-svg .bar.met { fill: var(--good); }
.chart-svg .goal { stroke: var(--ink-2); stroke-dasharray: 5 4; stroke-width: 1.2; }
.chart-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 170px; line-height: 1.35; box-shadow: var(--shadow); }
.heat-panel .kb-wrap { margin: 8px 0; }
.heat-legend { display: flex; align-items: center; gap: 8px; justify-content: center; }
.heat-ramp { width: 140px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--key), color-mix(in oklab, var(--bad) 50%, var(--key)), var(--bad)); border: 1px solid var(--rule); }
.weak { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; margin-top: 10px; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; font-size: 14px; width: 100%; }
.weak .tbl { width: auto; }
.tbl th { text-align: left; font-weight: 650; color: var(--ink-2); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--rule); }
.tbl td { padding: 7px 12px 7px 0; border-bottom: 1px solid color-mix(in oklab, var(--rule) 60%, transparent); font-variant-numeric: tabular-nums; }
.tbl .num { text-align: right; }

/* ── Options ── */
.options .opt { display: grid; gap: 10px; margin: 0 0 14px; }
.options legend { font-size: 18px; font-weight: 720; padding: 0 6px; margin-left: -6px; }
.opt-q { font-weight: 650; margin-top: 6px; }
.radio { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; cursor: pointer; }
.radio input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.row-inline { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }

/* ── Dialog & toast ── */
#dialog-root { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
#dialog-root[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(10, 14, 22, .45); }
.dialog { position: relative; background: var(--sheet); border-radius: 16px; padding: 22px; width: min(480px, 92vw); display: grid; gap: 12px; box-shadow: var(--shadow); border: 1px solid var(--rule); }
.dlg-title { font-size: 21px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 560; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: 90vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Responsive ── */
@media (max-width: 900px) {
  .lesson-grid { grid-template-columns: 1fr; }
  .lesson-side { position: static; }
  .charts { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .learn-top { grid-template-columns: 1fr; }
  .tips { grid-template-columns: 1fr; }
  .ba-pair { grid-template-columns: 1fr; }
  .drills { grid-template-columns: 1fr; }
  .lr-link { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .lr-keys { display: none; }
  .top-in { gap: 12px; flex-wrap: wrap; }
  .nav { order: 3; flex-basis: 100%; gap: 0; }
  .nav-link { padding: 6px 7px; font-size: 14px; }
  .sync-label { display: none; }
  .sync { padding: 4px 6px; }
  .tt-box { padding: 16px 16px 12px; }
  .tt-text { --tt: 22px; }
  .hands { display: none; }
  h1 { font-size: 31px; }
}
@media (max-width: 420px) {
  .wrap { padding: 0 16px; }
  .text-row { flex-direction: column; align-items: stretch; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── Steno ── */
.steno-how { display: grid; gap: 12px; margin-top: 10px; }
.steno-lessons, .steno .panel + .panel { margin-top: 16px; }
.steno-lessons { display: grid; gap: 10px; }
.st-title { font-family: var(--font-ui); font-variation-settings: "MONO" 0; font-size: 15px; color: var(--ink); }
.steno-kb { container-type: inline-size; width: 100%; max-width: 760px; margin: 0 auto; background: var(--kb-bed); border: 1px solid var(--rule); border-radius: 16px; padding: 10px; display: grid; gap: 1cqw; user-select: none; }
.sk-row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 1cqw; }
.sk-row.thumbs { grid-template-columns: repeat(5, 1fr); width: 46%; margin: 0 auto; }
.sk-row.num { grid-template-columns: 1fr; }
.sk { position: relative; height: 7.4cqw; border-radius: 1.2cqw; background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: .4cqw; display: grid; place-items: center; color: var(--key-ink); }
.sk.num-bar { height: 4.5cqw; background: var(--key-dim); }
.sk.vowel { background: color-mix(in oklab, var(--f-thumb) 25%, var(--key)); }
.sk.star { background: color-mix(in oklab, var(--f-rindex) 12%, var(--key)); }
.sk.right { background: color-mix(in oklab, var(--f-ring) 10%, var(--key)); }
.sk-name { font-weight: 750; font-size: max(13px, 2.9cqw); }
.sk-qw { position: absolute; right: 8%; bottom: 6%; font-size: max(9px, 1.5cqw); color: var(--ink-3); }
.num-bar .sk-qw { right: 2%; }
.sk-gap { visibility: hidden; }
.sk.want { background: var(--mark); color: var(--mark-ink); border-color: color-mix(in oklab, var(--mark) 50%, #000); box-shadow: 0 0 0 .5cqw color-mix(in oklab, var(--mark) 40%, transparent); }
.sk.down { background: var(--ink); color: var(--paper); }
.sk.down .sk-qw { color: var(--paper); opacity: .7; }
.st-box { text-align: center; display: grid; gap: 4px; padding: 26px; }
.st-word { font-size: 44px; font-weight: 760; font-variation-settings: "CASL" .6; }
.st-target { font-family: var(--font-mono); font-variation-settings: "MONO" 1; font-size: 26px; letter-spacing: .08em; color: var(--ink-2); }
.st-feedback { min-height: 26px; font-weight: 600; }
.st-feedback.ok { color: var(--good); }
.st-feedback.bad { color: var(--bad); }
.steno-drill .kb-area { gap: 14px; }

/* ── Choose keys ── */
.pick-panel { display: grid; gap: 14px; margin-top: 10px; }
.pick-panel > .btn { justify-self: start; }
.key.pickable { cursor: pointer; }
.key.pickable:hover { filter: brightness(.95); }
.key.picked { background: var(--zc); color: var(--zi); border-color: color-mix(in oklab, var(--zc) 60%, #000); box-shadow: 0 0 0 .4cqw color-mix(in oklab, var(--zc) 30%, transparent); }
#pick-input { max-width: 360px; font-family: var(--font-mono); font-variation-settings: "MONO" 1; letter-spacing: .15em; }

/* One moving line: no wrapping, the text slides left, typed text fades out at the left edge. */
.tt-text.one-line { max-height: 1.7em; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 92%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 92%, transparent 100%); }
.tt-text.one-line .tt-inner { white-space: pre; overflow-wrap: normal; width: max-content; transition: transform .09s ease-out; }
.tt-text.one-line { padding: 6px 0; }

</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dialog-root" hidden></div>
<script>
/* Course content: every lesson teaches keys + one English point + one tip for writing to Claude. */
(function (TT) {
  'use strict';

  // newChars = characters this lesson adds (used to check drills only use learned keys).
  TT.COURSE = [
    // ───────────── Part 1 · Keyboard basics ─────────────
    {
      id: 'home-row', part: 1, title: 'Home row', newChars: 'asdfjkl', show: ['A', 'S', 'D', 'F', 'J', 'K', 'L'], wpm: 10,
      intro: 'Put your left fingers on A S D F and your right fingers on J K L and the key after L. Feel the small bumps on F and J: your index fingers always come back there. Press the space bar with your thumb. Try not to look at your hands. Look at the screen.',
      en: {
        h: 'The verb “ask”',
        p: '“Ask” is the most useful verb when you talk to Claude.',
        list: ['ask a question', 'ask for help (not “ask help”)', 'ask someone to do something: I asked Claude to check my email.']
      },
      ai: { h: 'Just ask', p: 'You don’t need perfect English to use Claude. It understands mistakes. But a clear request gets a better answer. In this course you learn to write clear requests, one small step at a time.' },
      ex: [
        { t: 'fff jjj fff jjj fj fj jf jf fjf jfj ff jj fj', n: 'Index fingers on F and J. Thumb on the space bar.' },
        { t: 'ddd kkk ddd kkk dk kd fd jk df kj dkd kdk', n: 'Middle fingers: D and K.' },
        { t: 'sss lll aaa sl ls as la sal las all ask', n: 'Ring fingers: S and L. Left little finger: A.' },
        { t: 'as ask add all dad lad sad fall salad flask', n: 'Real words. You can already type them!' },
        { t: 'ask dad ask all a sad lad all fall add a salad ask a lad', n: '“Ask” is the key word of this course.' }
      ]
    },
    {
      id: 'e-i', part: 1, title: 'E and I', newChars: 'ei', show: ['E', 'I'], wpm: 12,
      intro: 'Your middle fingers reach up to E and I. After each key, go back to D and K.',
      en: {
        h: 'Past tense with -ed',
        p: 'Many verbs make the past tense with -ed:',
        list: ['ask → asked', 'add → added', 'fail → failed', 'like → liked', 'Yesterday I asked Claude a question.']
      },
      ai: { h: 'Share your idea first', p: 'Start with your idea: “I have an idea for a small website.” When Claude knows the idea, it can help you plan the next steps.' },
      ex: [
        { t: 'eee iii ded kik de ki ed ik eid ide', n: 'Middle fingers reach up, then come back home.' },
        { t: 'idea ideas said side like file slide skill field ideal' },
        { t: 'asked added failed filled liked aided sailed sealed', n: 'Past tense: verb + -ed.' },
        { t: 'i asked a lad i added a slide i like ideas a skill is ideal add a file', n: 'Small letters for now. The capital I comes in lesson 11.' }
      ]
    },
    {
      id: 'r-u', part: 1, title: 'R and U', newChars: 'ru', show: ['R', 'U'], wpm: 12,
      intro: 'Your index fingers reach up to R and U. Keep your other fingers on the home row.',
      en: {
        h: '“Read”: one spelling, two sounds',
        p: '“Read” has the same spelling in the present and the past, but not the same sound.',
        list: ['Now: I read (say “reed”) every day.', 'Yesterday: I read (say “red”) a book.']
      },
      ai: { h: 'Give rules', p: 'Claude follows your rules. Try: “Use simple words.” “Keep it short.” “Don’t change my meaning.” Clear rules give you the answer you want.' },
      ex: [
        { t: 'rrr uuu frf juj ru ur fur sure rule' },
        { t: 'read rule user sure issue real fair dear area ruler' },
        { t: 'rules users reads issues areas raised' },
        { t: 'a user reads a rule i asked if a deal is fair a real issue is rare sure i read all files' }
      ]
    },
    {
      id: 't-o', part: 1, title: 'T and O', newChars: 'to', show: ['T', 'O'], wpm: 14,
      intro: 'T is next to R: your left index finger reaches up and a little to the right. O is above L: use your right ring finger.',
      en: {
        h: 'to, too, two',
        p: 'These three words sound the same:',
        list: ['to: I want to learn. I go to work.', 'too: It is too long. Me too!', 'two: two ideas (the number 2)']
      },
      ai: { h: 'Name the task', p: 'Start with a task word: “Edit this text.” “List five ideas.” “Sort these words.” Then Claude knows at once what you want.' },
      ex: [
        { t: 'ttt ooo ftf lol tot oto to too it at' },
        { t: 'to it at too list task test edit title sort', n: 'Task words: list, edit, test, sort.' },
        { t: 'editor result tutor folder store start told total also' },
        { t: 'i asked a tutor to edit a list store old files to a folder a task list is a tool to start', n: '“to” + verb: to edit, to start.' }
      ]
    },
    {
      id: 'g-h', part: 1, title: 'G and H', newChars: 'gh', show: ['G', 'H'], wpm: 14,
      intro: 'G and H are in the middle of the home row. Your index fingers move to the side, then come back to F and J.',
      en: {

        h('p', null, 'Write a request, get feedback, then type the better version.'),
        e ? h('p', { class: 'done-line' }, icon('check'), 'Done · ' + fmtWpm(e.w) + ' WPM') : null,
        h('a', { class: 'btn primary big', href: '#coach' }, icon('edit'), 'Open the writing coach'));
    } else {
      side.append(h('h3', null, 'Exercises'));
      const ol = h('ol', { class: 'ex-list' });
      l.ex.forEach((e, i) => {
        const r = rec[i];
        ol.append(h('li', { class: 'ex-item' + (r && r.s >= 1 ? ' done' : '') },
          h('button', { type: 'button', class: 'ex-btn', onclick: () => startLessonExercise(idx, i) },

            h('span', { class: 'ex-text' }, e.t.length > 70 ? e.t.slice(0, 68) + '…' : e.t),

      });
      side.append(ol,
        h('p', { class: 'small muted' }, '3 stars: 97% accuracy and ' + targetFor(l.wpm) + ' words per minute.'),

          info.complete ? 'Practice again' : info.started ? 'Continue' : 'Start lesson'));
    }
    const nav = h('div', { class: 'lesson-nav' },
      idx > 0 ? h('a', { class: 'btn ghost', href: '#lesson-' + idx }, icon('back'), 'Lesson ' + idx) : h('span'),

  function tipCard(kind, label, t) {
    return h('section', { class: 'tip panel tip-' + kind },
      h('p', { class: 'tip-label' }, label),
      h('h3', null, t.h),
      t.p ? h('p', null, t.p) : null,
      t.list && t.list.length ? h('ul', { class: 'tip-list' }, t.list.map(x => h('li', null, x))) : null);
  }

  function startLesson(idx) {
    const l = COURSE[idx];
    if (l.coach) { location.hash = '#coach'; return; }
    const rec = (App.state.lessons[l.id] && App.state.lessons[l.id].ex) || {};
    let ei = l.ex.findIndex((e, i) => !(rec[i] && rec[i].s >= 1));
    if (ei < 0) ei = 0;
    startLessonExercise(idx, ei);
  }

  function startLessonExercise(li, ei) {
    const l = COURSE[li];
    const e = l.ex[ei];
    Typing.start({
      kind: 'lesson', title: l.title, sub: 'Exercise ' + (ei + 1) + ' of ' + l.ex.length,
      dots: l.ex.map((_, i) => { const r = (App.state.lessons[l.id] && App.state.lessons[l.id].ex[i]); return r ? r.s : -1; }), dot: ei,
      text: e.t, note: e.n, lang: 'en', target: targetFor(l.wpm),
      back: { label: 'Lesson ' + (li + 1), href: '#lesson-' + (li + 1) },
      ref: l.id + ':' + ei,
      complete(st, stars) {
        const before = lessonInfo(l).complete;
        const L = App.state.lessons[l.id] = App.state.lessons[l.id] || { ex: {} };
        const prev = L.ex[ei] || { s: 0, w: 0, a: 0 };
        L.ex[ei] = { s: Math.max(prev.s, stars), w: Math.max(prev.w, round1(st.wpm)), a: Math.max(prev.a, round1(st.acc)) };
        recordSession('lesson', l.id + ':' + ei, 'Lesson ' + (li + 1) + ': ' + l.title, st);
        const nowDone = lessonInfo(l).complete;
        const last = ei === l.ex.length - 1;
        const res = { lessonDone: !before && nowDone ? l : null };
        if (stars === 0) res.primary = { label: 'Try again', act: () => startLessonExercise(li, ei) };
        else if (!last) res.primary = { label: 'Next exercise', act: () => startLessonExercise(li, ei + 1) };
        else if (nowDone && li < COURSE.length - 1) res.primary = { label: 'Next lesson', act: () => { location.hash = '#lesson-' + (li + 2); } };
        else res.primary = { label: 'Back to the lesson', act: () => { location.hash = '#lesson-' + (li + 1); render(); } };
        if (stars > 0) res.secondary = { label: 'Try again', act: () => startLessonExercise(li, ei) };
        else res.secondary = last ? { label: 'Back to the lesson', act: () => { location.hash = '#lesson-' + (li + 1); render(); } } : { label: 'Skip to next', act: () => startLessonExercise(li, ei + 1) };
        return res;
      }
    });
  }

  const round1 = (x) => Math.round((x || 0) * 10) / 10;

  function recordSession(kind, ref, title, st) {
    const S = App.state;
    const now = Date.now();
    const secs = Math.max(1, Math.round(st.ms / 1000));
    S.history.push({ id: TT.uid('s'), t: now, k: kind, r: ref, title, w: round1(st.wpm), a: round1(st.acc), c: st.chars, d: secs });
    if (S.history.length > 400) S.history = S.history.slice(-400);
    const day = TT.dayKey(now);
    const D = S.dailyByDev[App.dev] = S.dailyByDev[App.dev] || {};
    D[day] = (D[day] || 0) + secs;
    const days = Object.keys(D).sort();
    if (days.length > 400) days.slice(0, days.length - 400).forEach(d => delete D[d]);
    const KB = S.keysByDev[App.dev] = S.keysByDev[App.dev] || {};
    Object.keys(st.hits).forEach(c => { const f = keyField(c); KB[f] = KB[f] || [0, 0]; KB[f][0] += st.hits[c]; });
    Object.keys(st.misses).forEach(c => { const f = keyField(c); KB[f] = KB[f] || [0, 0]; KB[f][1] += st.misses[c]; });
    saveState();
  }

  // ───────────────────────── Typing engine + view ─────────────────────────
  const Typing = {
    active: false, sess: null, timer: null,
    start(sess) {
      if (this.active) this.stop();
      this.active = true;
      this.sess = sess;
      App.view = 'typing';
      const view = document.getElementById('view');
      view.textContent = '';
      view.className = 'view view-typing';
      buildTyping(view, sess);
      window.scrollTo(0, 0);
    },
    stop() {
      this.active = false;
      clearInterval(this.timer);
      App.keyHandler = null;
      if (P.tts && P.tts.stop) { try { P.tts.stop(); } catch (e) { /* ignore */ } }
    }
  };
  TT.Typing = Typing;

  function buildTyping(view, sess) {
    const S = App.state.settings;
    const layout = App.layout;
    const chars = Array.from(TT.cleanText(sess.text, layout));
    if (!chars.length) chars.push('.');
    const text = chars.join('');
    let pos = 0, strokes = 0, errors = 0, start = 0, last = 0, active = 0, done = false;
    const typed = [];
    const slips = new Set();
    const hits = {}, misses = {};
    const missAt = new Set();

    // header
    const dots = sess.dots ? h('span', { class: 'ex-dots', 'aria-hidden': 'true' },
      sess.dots.map((s, i) => h('span', { class: 'xd' + (i === sess.dot ? ' cur' : '') + (s >= 1 ? ' ok' : '') }))) : null;
    const head = h('div', { class: 'ty-head' },
      h('a', { class: 'back', href: sess.back.href, onclick: (e) => { if (sess.back.act) { e.preventDefault(); sess.back.act(); } } }, icon('back'), sess.back.label),
      h('div', { class: 'ty-title' }, h('strong', null, sess.title), sess.sub ? h('span', { class: 'muted' }, sess.sub) : null, dots));

    const listen = h('button', { class: 'btn ghost small', type: 'button', 'data-listen': '1', hidden: !P.tts, onclick: () => speak(text, sess.lang) }, icon('speaker'), 'Listen');
    const noteRow = h('div', { class: 'ty-note' }, sess.note ? h('p', null, sess.note) : h('p', { class: 'muted' }, 'Type the text below. Keep your eyes on the screen.'), listen);

    const inner = h('div', { class: 'tt-inner' });
    const spans = chars.map((c, i) => {
      const sp = h('span', { class: 'ch' + (c === ' ' ? ' sp' : '') }, c);
      inner.append(sp);
      void i;
      return sp;
    });
    const oneLine = (S.textView || 'line') === 'line';
    const textEl = h('div', { class: 'tt-text' + (oneLine ? ' one-line' : ''), role: 'textbox', 'aria-readonly': 'true', 'aria-label': 'Text to type: ' + text, tabindex: '0' }, inner);
    const statW = h('strong', null, '–'), statA = h('strong', null, '100%'), statT = h('strong', null, '0:00');
    const bar = h('span');
    const stats = h('div', { class: 'tt-stats' },
      h('span', { class: 'stat' }, statW, h('span', null, 'words per minute')),
      h('span', { class: 'stat' }, statA, h('span', null, 'accuracy')),
      h('span', { class: 'stat' }, statT, h('span', null, 'time')),
      h('span', { class: 'tt-prog', 'aria-hidden': 'true' }, bar));
    const box = h('div', { class: 'tt-box' }, textEl, stats);

    const hint = h('p', { class: 'ty-hint', 'aria-live': 'off' });
    const caps = h('span', { class: 'caps-chip', hidden: true }, 'Caps Lock is on');
    const banner = h('div', { class: 'layout-banner', hidden: true });
    const touch = h('button', { class: 'btn ghost small touch-btn', type: 'button', onclick: () => sink.focus() }, icon('keyboard'), 'Tap to type');
    const sink = h('textarea', { class: 'sink', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Typing input' });
    const kb = S.showKb ? TT.Keyboard({ layout }) : null;
    const hands = S.showHands ? TT.Hands() : null;
    const layoutNote = h('p', { class: 'small muted layout-note' }, 'Keyboard: ' + layout.name + ' · ', h('a', { href: '#options' }, 'change'));
    const result = h('div', { class: 'result', hidden: true, 'aria-live': 'polite' });

    const tw = h('div', { class: 'wrap typing' }, head, noteRow, banner, box,
      h('div', { class: 'hint-row' }, hint, caps, touch), result,
      h('div', { class: 'kb-area' + (kb ? '' : ' no-kb') }, kb ? kb.el : null, hands ? hands.el : null, layoutNote),
      sink);
    view.append(tw);

    let lineH = 0, lastTop = -1;
    function measure() {
      lineH = parseFloat(getComputedStyle(textEl).lineHeight) || (spans[0] ? spans[0].offsetHeight : 40);
    }
    function scrollLine() {
      const sp = spans[Math.min(pos, spans.length - 1)];
      if (!sp) return;
      if (oneLine) {
        // The cursor stays in the middle of the line; the text slides left under it.
        const anchor = textEl.clientWidth * 0.5;
        const x = sp.offsetLeft + (pos >= spans.length ? sp.offsetWidth : 0);
        inner.style.transform = 'translateX(' + (anchor - x) + 'px)';
        return;
      }
      const top = sp.offsetTop;
      if (top === lastTop) return;
      lastTop = top;
      const shift = Math.max(0, top - lineH * (top > lineH * 1.5 ? 1 : 0));
      inner.style.transform = 'translateY(' + (-shift) + 'px)';
    }
    function paintCursor() {
      spans.forEach(sp => sp.classList.remove('cur'));
      if (pos < spans.length) spans[pos].classList.add('cur');
      const ch = chars[pos];
      const target = ch != null ? TT.keyFor(layout, ch) : null;
      if (kb) kb.highlight(target);
      if (hands) hands.set(target ? [target.finger, target.shiftFinger].filter(Boolean) : []);
      hint.textContent = '';
      if (ch == null) return;
      if (ch === ' ') hint.append('Next: ', TT.keycap('Space', 'wide'), ' ', fingerChip('th'));
      else if (target) {
        hint.append('Next: ', TT.keycap(ch), ' ', fingerChip(target.finger));
        if (target.shift) hint.append(' + ', TT.keycap(target.shiftCode === 'ShiftLeft' ? 'left Shift' : 'right Shift', 'wide'), ' ', fingerChip(target.shiftFinger));
      } else hint.append('Next: ', TT.keycap(ch));
      scrollLine();
    }
    function curMs() {
      if (!start) return 0;
      return active + (done ? 0 : Math.min(performance.now() - last, 3000));
    }
    function correctCount() {
      if (S.onError === 'stop') return pos;
      let n = 0; for (let i = 0; i < pos; i++) if (typed[i] === chars[i]) n++;
      return n;
    }
    function updateStats(final) {
      const ms = curMs();
      const w = TT.wpm(correctCount(), ms);
      const acc = strokes ? (strokes - errors) / strokes * 100 : 100;
      // Speed is noise for the first few keys, so wait for a fair sample.
      statW.textContent = start && (final || ms >= 4000 || (pos >= 6 && ms >= 1500)) ? fmtWpm(w) : '–';
      statA.textContent = fmtAcc(acc);
      statT.textContent = fmtClock(ms);
      bar.style.width = Math.round(pos / chars.length * 100) + '%';
    }

    function input(ch, code) {
      if (done) return;
      const now = performance.now();
      if (!start) { start = now; last = now; }
      else { active += Math.min(now - last, 3000); last = now; }
      const expected = chars[pos];
      strokes++;
      const ok = ch === expected;
      if (!ok) {
        errors++;
        if (!missAt.has(pos)) { missAt.add(pos); misses[expected] = (misses[expected] || 0) + 1; }
      } else if (!missAt.has(pos) || S.onError === 'stop') {
        hits[expected] = (hits[expected] || 0) + 1;
      }
      if (kb && code) kb.flash(code, ok);
      if (S.sound === 'all' && ok) TT.Sound.click();
      if (S.sound !== 'off' && !ok) TT.Sound.error();
      if (S.onError === 'stop') {
        if (ok) { spans[pos].classList.add('done'); pos++; }
        else {
          slips.add(pos); spans[pos].classList.add('slip');
          box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        }
      } else {
        typed[pos] = ch;
        spans[pos].classList.add(ok ? 'done' : 'bad');
        pos++;
      }
      if (pos >= chars.length) { finish(); return; }
      paintCursor();
      updateStats();
    }
    function backspace() {
      if (done || S.onError === 'stop' || pos === 0) return;
      pos--;
      typed.length = pos;
      spans[pos].classList.remove('done', 'bad');
      paintCursor(); updateStats();
    }
    function restart() {
      Typing.start(sess);
    }
    function finish() {
      done = true;
      clearInterval(Typing.timer);
      spans.forEach(sp => sp.classList.remove('cur'));
      if (kb) kb.highlight(null);
      if (hands) hands.set([]);
      hint.textContent = '';
      const ms = Math.max(active, 1000);
      const st = { wpm: TT.wpm(correctCount(), ms), acc: strokes ? (strokes - errors) / strokes * 100 : 100, ms, chars: chars.length, hits, misses, errors, strokes };
      const stars = TT.stars(st.acc, st.wpm, sess.target || 20);
      const out = sess.complete(st, stars) || {};
      tw.classList.add('is-done');
      showResult(st, stars, out);
      updateStats(true);
    }
    function showResult(st, stars, out) {
      result.textContent = '';
      const titles = ['Almost! You need 90% accuracy for a star.', 'Good. Now aim for more accuracy.', 'Well done!', 'Excellent!'];
      const missList = Object.keys(misses).sort((a, b) => misses[b] - misses[a]).slice(0, 6);
      const primary = out.primary || { label: 'Again', act: restart };
      const secondary = out.secondary || null;
      add(result,
        h('div', { class: 'res-top' },
          h('div', null, h('h2', null, titles[stars]), TT.starRow(stars, 3)),
          h('div', { class: 'res-nums' },
            h('span', { class: 'rn' }, h('strong', null, fmtWpm(st.wpm)), h('span', null, 'words per minute')),
            h('span', { class: 'rn' }, h('strong', null, fmtAcc(st.acc)), h('span', null, 'accuracy')),
            h('span', { class: 'rn' }, h('strong', null, fmtClock(st.ms)), h('span', null, 'time')))),
        missList.length ? h('p', { class: 'res-miss' }, 'Practice these keys: ', missList.map(c => h('span', { class: 'miss' }, TT.keycap(c === ' ' ? 'Space' : c, c === ' ' ? 'wide' : ''), '×' + misses[c]))) :
          h('p', { class: 'res-miss' }, 'No mistakes. Great control!'),

  // ───────────────────────── Steno basics (court reporters' machine shorthand) ─────────────────────────
  // Plover's keyboard mapping: physical keys (event.code) → steno keys. Works on any layout.
  const STENO_MAP = {
    KeyQ: 'S-', KeyA: 'S-', KeyW: 'T-', KeyS: 'K-', KeyE: 'P-', KeyD: 'W-', KeyR: 'H-', KeyF: 'R-',
    KeyT: '*', KeyY: '*', KeyG: '*', KeyH: '*', KeyC: 'A-', KeyV: 'O-', KeyN: '-E', KeyM: '-U',
    KeyU: '-F', KeyJ: '-R', KeyI: '-P', KeyK: '-B', KeyO: '-L', KeyL: '-G', KeyP: '-T', Semicolon: '-S',
    BracketLeft: '-D', Quote: '-Z',
    Digit1: '#', Digit2: '#', Digit3: '#', Digit4: '#', Digit5: '#', Digit6: '#', Digit7: '#', Digit8: '#', Digit9: '#', Digit0: '#'
  };
  const STENO_ORDER = ['#', 'S-', 'T-', 'K-', 'P-', 'W-', 'H-', 'R-', 'A-', 'O-', '*', '-E', '-U', '-F', '-R', '-P', '-B', '-L', '-G', '-T', '-S', '-D', '-Z'];
  const stenoLetter = (k) => k.replace('-', '');
  // Set of steno keys → written stroke, e.g. {K-, A-, -T} → "KAT", {-T} → "-T".
  function strokeString(keys) {
    let left = '', mid = '', right = '';
    STENO_ORDER.forEach(k => {
      if (!keys.has(k)) return;
      if (['A-', 'O-', '*', '-E', '-U'].includes(k)) mid += stenoLetter(k);
      else if (k === '#' || k.endsWith('-')) left += stenoLetter(k);
      else right += stenoLetter(k);
    });
    return left + mid + (right && !mid ? '-' : '') + right;
  }
  // Written stroke → set of steno keys.
  function parseStroke(str) {
    const set = new Set();
    let i = 0;
    for (const ch of str) {
      if (ch === '-') { i = Math.max(i, STENO_ORDER.indexOf('-F')); continue; }
      let j = i;
      while (j < STENO_ORDER.length && stenoLetter(STENO_ORDER[j]) !== ch) j++;
      if (j >= STENO_ORDER.length) return null;
      set.add(STENO_ORDER[j]); i = j + 1;
    }
    return set;
  }
  TT.strokeString = strokeString; TT.parseStroke = parseStroke;

  const STENO_LESSONS = [
    { id: 'steno-1', title: 'The steno keys', info: 'One key per stroke. Press it, then let go. Read the key name: S, T, K... The dash shows the right hand: -F, -T.',

    { id: 'steno-3', title: 'Whole words in one chord', info: 'Press all keys of a word at the same time: the start with the left hand, the vowel with a thumb, the end with the right hand.',
      items: [['cat', 'KAT'], ['sat', 'SAT'], ['hat', 'HAT'], ['rat', 'RAT'], ['tap', 'TAP'], ['top', 'TOP'], ['set', 'SET'], ['red', 'RED'], ['stop', 'STOP'], ['sit', 'SEUT']] },
    { id: 'steno-4', title: 'Letters from chords', info: 'The left hand has only 7 keys, so some letters are chords: D = TK, B = PW, L = HR, M = PH, F = TP, N = TPH, G = TKPW.',

    { id: 'steno-5', title: 'Common short forms', info: 'Court reporters learn "briefs": short chords for very common words. These are from the Plover dictionary.',
      items: [['and', 'SKP'], ['to', 'TO'], ['a', 'AEU'], ['in', 'TPH'], ['for', 'TP'], ['on', 'OPB'], ['that', 'THA'], ['was', 'WAS'], ['not', 'TPHOT'], ['but', 'PWU'], ['what', 'WHA'], ['have', 'SR'], ['this', 'TH'], ['we', 'WE'], ['they', 'THE']] }

  function stenoKeyboard() {
    // Physical rows as on a steno machine: two rows of consonants, a thumb row, a number bar.
    const rows = [
      ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'BracketLeft'],
      ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon', 'Quote'],
      ['KeyC', 'KeyV', null, 'KeyN', 'KeyM']
    ];
    const byKey = {};
    const root = h('div', { class: 'steno-kb', 'aria-hidden': 'true' });
    const keyEl = (code) => {
      const sk = STENO_MAP[code];
      const m = App.layout.map[code];
      const el = h('div', { class: 'sk' + (sk === '*' ? ' star' : '') + (['A-', 'O-', '-E', '-U'].includes(sk) ? ' vowel' : '') + (sk.startsWith('-') && sk.length > 1 && !['-E', '-U'].includes(sk) ? ' right' : '') },
        h('span', { class: 'sk-name' }, stenoLetter(sk)), h('span', { class: 'sk-qw' }, m ? (m[1] && m[0].length === 1 && m[0].toUpperCase() === m[1] ? m[1] : m[0]) : ''));
      (byKey[sk] = byKey[sk] || []).push(el);

    };

    (byKey['#'] = []).push(root.lastChild.firstChild);
    rows.forEach((r, i) => root.append(h('div', { class: 'sk-row' + (i === 2 ? ' thumbs' : '') }, r.map(c => c ? keyEl(c) : h('div', { class: 'sk-gap' })))));
    return {
      el: root,
      set(cls, keys) {
        Object.values(byKey).flat().forEach(el => el.classList.remove(cls));
        if (keys) keys.forEach(k => (byKey[k] || []).forEach(el => el.classList.add(cls)));
      }
    };
  }

  const Steno = { hints: true };

    wrap.append(h('section', { class: 'panel' }, h('h3', null, 'Learn more (free)'),
      h('ul', { class: 'tip-list' },
        h('li', null, h('a', { href: 'https://www.openstenoproject.org/plover/' }, 'Plover'), ': free software that makes your keyboard a steno machine everywhere on your computer.'),
        h('li', null, h('a', { href: 'https://www.artofchording.com/' }, 'Art of Chording'), ' and Learn Plover!: free books that teach the whole steno theory.'),
        h('li', null, h('a', { href: 'https://didoesdigital.com/typey-type/' }, 'Typey Type'), ': free steno practice with many lessons.'))));

  function startSteno(li, rounds) {
    const L = STENO_LESSONS[li];
    const view = document.getElementById('view');
    if (Typing.active) Typing.stop();
    App.view = 'steno-drill';
    view.textContent = '';
    view.className = 'view view-steno';
    // 16 prompts: every item once, then random repeats.
    const order = L.items.slice().sort(() => Math.random() - 0.5);
    while (order.length < 16) order.push(L.items[Math.floor(Math.random() * L.items.length)]);
    const prompts = order.slice(0, Math.max(16, L.items.length));
    let idx = 0, strokes = 0, errors = 0, start = 0, last = 0, active = 0, done = false;
    const down = new Set(), chord = new Set();
    const kb = stenoKeyboard();
    const word = h('p', { class: 'st-word' }), target = h('p', { class: 'st-target' }), feedback = h('p', { class: 'st-feedback', 'aria-live': 'polite' });
    const count = h('span', { class: 'muted' });
    const hintBox = h('input', { type: 'checkbox', id: 'st-hints', checked: Steno.hints });
    hintBox.addEventListener('change', () => { Steno.hints = hintBox.checked; show(); });
    const result = h('div', { class: 'result', hidden: true });
    const tw = h('div', { class: 'wrap typing steno-drill' },
      h('div', { class: 'ty-head' },
        h('a', { class: 'back', href: '#steno' }, icon('back'), 'Steno basics'),
        h('div', { class: 'ty-title' }, h('strong', null, L.title), count)),
      h('p', { class: 'ty-note muted' }, L.info),
      h('div', { class: 'tt-box st-box' }, word, target, feedback),
      result,
      h('div', { class: 'kb-area' }, kb.el,
        h('label', { class: 'radio', for: 'st-hints' }, hintBox, h('span', null, 'Show the keys to press'))));
    view.append(tw);
    function show() {
      const [w, st] = prompts[idx];
      word.textContent = w;
      target.textContent = Steno.hints ? st : '?';
      kb.set('want', Steno.hints ? parseStroke(st) : null);
      count.textContent = 'Word ' + (idx + 1) + ' of ' + prompts.length;
    }
    function stroke() {
      if (done) return;
      const now = performance.now();
      if (!start) { start = now; last = now; } else { active += Math.min(now - last, 4000); last = now; }
      const got = strokeString(chord);
      const [w, st] = prompts[idx];
      strokes++;
      chord.clear();
      if (got === strokeString(parseStroke(st))) {
        feedback.textContent = '✓ ' + got + ' = ' + w;
        feedback.className = 'st-feedback ok';
        idx++;
        if (idx >= prompts.length) return finish();
        show();
      } else {
        errors++;
        feedback.textContent = 'You pressed ' + (got || '?') + '. For “' + w + '” press ' + st + '.';
        feedback.className = 'st-feedback bad';
        if (S().sound !== 'off') TT.Sound.error();
        kb.set('want', parseStroke(st));
      }
    }
    const S = () => App.state.settings;
    function finish() {
      done = true;
      kb.set('want', null); kb.set('down', null);
      const ms = Math.max(active, 1000);
      const wpm = prompts.length / (ms / 60000);
      const acc = (strokes - errors) / strokes * 100;
      const stars = TT.stars(acc, wpm, 15);
      const rec = App.state.lessons[L.id] = App.state.lessons[L.id] || { ex: {} };
      const prev = rec.ex[0] || { s: 0, w: 0, a: 0 };
      rec.ex[0] = { s: Math.max(prev.s, stars), w: Math.max(prev.w, round1(wpm)), a: Math.max(prev.a, round1(acc)) };
      recordSession('steno', L.id, 'Steno: ' + L.title, { wpm, acc, ms, chars: prompts.length, hits: {}, misses: {} });
      result.textContent = '';
      const next = li < STENO_LESSONS.length - 1 && stars >= 1;
      add(result,
        h('div', { class: 'res-top' },
          h('div', null, h('h2', null, ['Almost! You need 90% correct chords.', 'Good. Now aim for fewer mistakes.', 'Well done!', 'Excellent!'][stars]), TT.starRow(stars, 3)),
          h('div', { class: 'res-nums' },
            h('span', { class: 'rn' }, h('strong', null, String(Math.round(wpm))), h('span', null, 'words per minute')),
            h('span', { class: 'rn' }, h('strong', null, fmtAcc(acc)), h('span', null, 'correct chords')),
            h('span', { class: 'rn' }, h('strong', null, fmtClock(ms)), h('span', null, 'time')))),
        h('p', { class: 'small muted' }, '3 stars: 97% correct chords and 15 words per minute.'),
        h('div', { class: 'res-actions' },
          h('button', { class: 'btn ghost', type: 'button', onclick: () => startSteno(li) }, icon('retry'), 'Try again', h('span', { class: 'kbd-hint' }, 'Esc')),
          h('button', { class: 'btn primary', type: 'button', onclick: () => next ? startSteno(li + 1) : (location.hash = '#steno', render()) }, next ? 'Next lesson' : 'Back to Steno basics', h('span', { class: 'kbd-hint' }, 'Enter'))));
      result.hidden = false;
      App.resultKeys = { enter: () => next ? startSteno(li + 1) : (location.hash = '#steno', render()), esc: () => startSteno(li) };
    }
    App.keyHandler = (e) => {
      if (done) {
        if (e.key === 'Enter') { e.preventDefault(); App.resultKeys.enter(); }
        else if (e.key === 'Escape') { e.preventDefault(); App.resultKeys.esc(); }

  }

  // ───────────────────────── Choose keys ─────────────────────────
  // Drill text from the picked keys. "only": every character is a picked key. "focus": real words that contain them.
  function pickDrill() {
    const S = App.state.settings;
    const picked = new Set(Array.from(S.pickKeys || ''));
    if (!picked.size) return '';
    const letters = [...picked].filter(c => /[a-z]/.test(c));
    const other = [...picked].filter(c => !/[a-z]/.test(c));
    const words = Array.from(new Set(dictionary().concat(TT.HAND_WORDS))).filter(w => w.length > 1);
    if (S.pickMode === 'focus') {
      const pool = words.filter(w => [...w].some(c => picked.has(c)));
      let t = TT.makeDrill(pool.length >= 5 ? pool : words, TT.allowedChars(COURSE, 12), letters, 18);
      if (other.length) t = t.split(' ').map((w, i) => i % 3 === 2 ? w + other[i % other.length] : w).join(' ');
      return t;
    }
    const allowed = new Set([' ', ...picked]);
    const pool = words.filter(w => [...w].every(c => allowed.has(c)));
    const rnd = (a) => a[Math.floor(Math.random() * a.length)];
    const keys = [...picked];
    const group = () => { let g = ''; const n = 2 + Math.floor(Math.random() * 3); for (let i = 0; i < n; i++) g += rnd(keys); return g; };
    const out = [];
    // Real words when there are enough; otherwise key groups like "fjf jfk".
    for (let i = 0; i < 18; i++) out.push(pool.length >= 6 && Math.random() < 0.75 ? rnd(pool) : group());
    return out.join(' ');
  }

  function renderPickKeys(view) {
    const S = App.state.settings;
    const save = () => { App.state.settingsAt = Date.now(); saveState(); };
    const picked = new Set(Array.from(S.pickKeys || ''));
    const wrap = h('div', { class: 'wrap pick' });
    wrap.append(h('a', { class: 'back', href: '#practice' }, icon('back'), 'Practice'));
    wrap.append(h('header', { class: 'page-head' }, h('h1', { class: 'display' }, 'Choose keys'),
      h('p', { class: 'lede' }, 'Click the keys you want to practice, or type them in the box. Then start.')));
    const input = h('input', { id: 'pick-input', class: 'input', type: 'text', maxlength: '40', autocomplete: 'off', spellcheck: 'false', value: [...picked].join(''), placeholder: 'For example: qzxp' });

      S.pickKeys = [...picked].join('');
      input.value = S.pickKeys;

      startBtn.disabled = !picked.size;
      const words = Array.from(new Set(dictionary().concat(TT.HAND_WORDS))).filter(w => w.length > 1 && [...w].every(c => picked.has(c)));

        ? (words.length >= 6 ? words.length + ' real words use only these keys, for example: ' + words.slice(0, 5).join(', ') + '.' : 'Few real words use only these keys, so you will mostly type key groups like “' + [...picked].slice(0, 3).join('') + '”.')

      const ch = m && m[0];
      if (!ch || (ch[0] === '~' && ch.length > 1)) return;
      if (picked.has(ch)) picked.delete(ch); else picked.add(ch);
      update(); save();
    } });
    input.addEventListener('input', () => {
      picked.clear();
      for (const c of input.value.toLowerCase()) if (c !== ' ' && App.layout.charToKey[c]) picked.add(c);
      update(); save();
    });
    const radio = (v, label) => {
      const r = h('input', { type: 'radio', name: 'pickmode', id: 'pick-' + v, checked: S.pickMode === v });

      return h('label', { class: 'radio', for: 'pick-' + v }, r, h('span', null, label));
    };
    const quick = (label, chars) => h('button', { class: 'chip', type: 'button', onclick: () => { picked.clear(); [...chars].forEach(c => picked.add(c)); update(); save(); } }, label);
    const weak = weakKeys(6).map(k => k.c.toLowerCase()).filter(c => c !== ' ');
    startBtn.addEventListener('click', () => startDrill('pick'));
    wrap.append(h('section', { class: 'panel pick-panel' },
      h('div', { class: 'ideas' }, h('span', { class: 'small muted' }, 'Quick choice:'),
        quick('Home row', 'asdfghjkl'), quick('Top row', 'qwertyuiop'.replace(App.layout.id === 'cz' || App.layout.id === 'de' ? 'y' : '@', 'z')), quick('Bottom row', App.layout.id === 'cz' || App.layout.id === 'de' ? 'yxcvbnm' : 'zxcvbnm'),
        quick('Left hand', [...'abcdefghijklmnopqrstuvwxyz'].filter(c => { const t = TT.keyFor(App.layout, c); return t && TT.FINGERS[t.finger].hand === 'L'; }).join('')),
        quick('Right hand', [...'abcdefghijklmnopqrstuvwxyz'].filter(c => { const t = TT.keyFor(App.layout, c); return t && TT.FINGERS[t.finger].hand === 'R'; }).join('')),
        weak.length ? quick('My weak keys', weak.join('')) : null,
        h('button', { class: 'chip', type: 'button', onclick: () => { picked.clear(); update(); save(); } }, 'Clear')),
      h('div', { class: 'kb-wrap' }, kb.el),
      h('div', { class: 'field' }, h('label', { for: 'pick-input' }, 'Your keys'), input),
      h('div', { class: 'row-inline' }, radio('only', 'Only these keys'), radio('focus', 'Real words with these keys')),
      info, startBtn));
    view.append(wrap);
    update();
  }

  // ───────────────────────── Practice ─────────────────────────
  const Gen = { topic: '', level: 'B1', len: 'medium', busy: false, result: null, error: '', ctl: null };
  let editing = null; // { id?, title, body }
